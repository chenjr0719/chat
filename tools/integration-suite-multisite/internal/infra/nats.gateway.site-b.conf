server_name: nats-site-b
cluster: {
  name: site-b
  listen: 0.0.0.0:6222
  routes: [
    nats://nats-site-b:6222
  ]
}
# Leafnode spoke. site-b dials into site-a's leaf hub using backend.creds
# (same chatapp account as site-a) so cross-domain JetStream Source pulls
# from OUTBOX_site-a → INBOX_site-b flow over the leaf link. See the
# matching site-a conf for why this is leafnode rather than gateway.
leafnodes: {
  remotes: [
    {
      url: nats-leaf://nats-site-a:7422
      credentials: /etc/nats/backend.creds
    }
  ]
}
jetstream: {
  domain: site-b
  store_dir: /data/jetstream
}
