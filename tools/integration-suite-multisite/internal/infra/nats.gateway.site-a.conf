server_name: nats-site-a
# Single-node JetStream cluster — size 1, no peer routes. Required for
# the JS meta-leader role to activate, which is what publishes
# cross-domain interest in $JS.<peer>.API.> over the leafnode link.
# Without a cluster: block (Runs 65-68) standalone JS skips meta-leader
# activation and cross-domain Source consumer-create returns 10059
# "stream not found". A self-route here (Runs 60-61) blocks election
# forever waiting for a peer; no routes means instant single-vote
# election.
cluster: {
  name: site-a
  listen: 0.0.0.0:6222
}
# Leafnode hub. site-b dials in here as a leaf using backend.creds (same
# chatapp account as site-a), which lets cross-domain JetStream Source
# pulls flow over the leaf link. NATS supercluster gateways do NOT carry
# $JS.<peer>.API across clusters (verified empirically — see
# docs/integration-suite-multisite-findings.md F-001); leafnodes do.
leafnodes: {
  port: 7422
}
jetstream: {
  domain: site-a
  store_dir: /data/jetstream
}
