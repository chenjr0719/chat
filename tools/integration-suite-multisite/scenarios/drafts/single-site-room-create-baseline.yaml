scenario: single-site-room-create-baseline
source: spec docs/superpowers/specs/2026-06-03-integration-suite-multisite-design.md §8
status: draft
tag: positive

# Baseline scenario: proves the multi-site infra runs a single-site
# create-room flow end-to-end. No federation assertion. Alice (firing
# user) creates a room and lists bob as the other member; both are
# seeded on site-a so room-service-site-a can resolve bob locally.
#
# Mirrors the single-site room-service-create-room-persists-via-
# room-worker.yaml scenario adapted to the multi-site shape.

sites:
  site-a:
    seed:
      users:
        alice: { verified: true }
        bob:   { verified: true }

input:
  site: site-a
  verb: nats_request
  subject: chat.user.${alice.account}.request.room.site-a.create
  payload:
    name: Engineering
    users: ["${bob.account}"]
  credential: ${alice.credential}

expected:
  - location: reply
    match:
      body_json:
        status: accepted
        roomType: channel
  - location: mongo_find
    site: site-a
    args:
      collection: rooms
      filter:
        name: Engineering
    match:
      name: Engineering
      type: channel
      siteId: site-a
