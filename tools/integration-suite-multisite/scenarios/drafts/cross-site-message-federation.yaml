scenario: cross-site-message-federation
source: spec docs/superpowers/specs/2026-06-03-integration-suite-multisite-design.md §1 row 1 (federation as primary multi-site use case) + §6.1.2 (federation catalog)
status: draft
tag: positive

# Real federation test: alice on site-a sends a message to a room both
# sites are members of. Asserts (a) the local canonical event lands on
# site-a's MESSAGES_CANONICAL_site-a, and (b) the federation tail
# delivers an outbox-style event to site-b's INBOX_site-b — the exact
# path OUTBOX_site-a -> JetStream Sources -> INBOX_site-b that the
# spec describes.
#
# Pre-seed pattern: same room (r-shared) pre-seeded on BOTH sites'
# Mongos with alice as member on site-a and bob as member on site-b.
# This bypasses the create-room path (which doesn't support cross-site
# members on a single API call) so the test exercises message-flow
# federation directly.
#
# The federation tail filter (outbox.site-a.to.site-b.>) mirrors the
# Source filter in catalogs/federation.yaml: whatever broadcast-worker-
# site-a publishes on that subject pattern should appear in INBOX_site-b
# within the timeout. If it doesn't, the failure surface shows the
# closest event's payload verbatim, naming what actually happened.

sites:
  site-a:
    seed:
      users:
        alice: { verified: true }
      rooms:
        - id: r-shared
          name: SharedChannel
          type: channel
      memberships:
        alice: [r-shared]
  site-b:
    seed:
      users:
        bob: { verified: true }
      rooms:
        - id: r-shared
          name: SharedChannel
          type: channel
      memberships:
        bob: [r-shared]

input:
  site: site-a
  verb: jetstream_publish
  subject: chat.user.${alice.account}.room.r-shared.site-a.msg.send
  payload:
    # 20-char base62 message ID per message-gatekeeper's
    # idgen.IsValidMessageID check (handler.go:168 in single-site).
    id: mCrossSiteFed00000001
    content: Hello bob from site-a
    # Hyphenated UUID required by gatekeeper's payload-level
    # requestId check (handler.go:163 -> idgen.IsValidUUID).
    requestId: 01970000-0000-7000-8000-c0551be11000
  credential: ${alice.credential}

expected:
  # Surface 1 — local canonical event on site-a.
  # message-gatekeeper-site-a validates and publishes
  # chat.msg.canonical.site-a.created on MESSAGES_CANONICAL_site-a.
  - location: jetstream_consume
    site: site-a
    args:
      stream: MESSAGES_CANONICAL_site-a
      filter_subject: chat.msg.canonical.site-a.created
    match:
      body_json:
        event: created
        siteId: site-a
        message:
          id: mCrossSiteFed00000001
          roomId: r-shared
          userAccount: ${alice.account}
          content: Hello bob from site-a

  # Surface 2 — federation tail on site-b.
  # broadcast-worker-site-a publishes cross-site events to
  # outbox.site-a.to.site-b.* (the OUTBOX_site-a subject pattern).
  # The federation Source on INBOX_site-b filters that same prefix
  # (per catalogs/federation.yaml) so the event arrives at site-b's
  # INBOX. Assertion times out at 15s to cover the broadcast-worker
  # fan-out + Source delivery latency.
  - location: jetstream_consume
    site: site-b
    args:
      stream: INBOX_site-b
      filter_subject: outbox.site-a.to.site-b.>
    match:
      body_json:
        message:
          id: mCrossSiteFed00000001
          roomId: r-shared
    timeout: 15s
